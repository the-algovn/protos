syntax = "proto3";

package algovn.tts.v1;

option go_package = "github.com/the-algovn/protos/gen/go/algovn/tts/v1;ttsv1";

// TTSService synthesizes Vietnamese speech for the algovn services. Internal
// only: it is never registered at a gateway, and no browser calls it. Audio
// bytes travel in the response because utterances are short (a DJ break is a
// few hundred characters); callers that need a URL store the bytes themselves.
service TTSService {
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse);
  rpc ListVoices(ListVoicesRequest) returns (ListVoicesResponse);
  // CreateVoice registers a self-hosted voice cloned from a reference clip.
  // A voice saved from DesignVoice is created the same way, with the chosen
  // take as ref_audio and the design's sample_text as ref_text.
  rpc CreateVoice(CreateVoiceRequest) returns (CreateVoiceResponse);
  // DesignVoice renders candidate takes of a voice described in words.
  // Stateless: nothing is stored until the caller saves a take.
  rpc DesignVoice(DesignVoiceRequest) returns (DesignVoiceResponse);
  // DeleteVoice removes a self-hosted voice. Unknown id -> NOT_FOUND; non-voxcpm id -> INVALID_ARGUMENT. Ids are never reused.
  rpc DeleteVoice(DeleteVoiceRequest) returns (DeleteVoiceResponse);
}

// AudioFormat is the container the caller wants back, regardless of what the
// backend natively emits.
enum AudioFormat {
  AUDIO_FORMAT_UNSPECIFIED = 0;
  AUDIO_FORMAT_MP3 = 1;
  AUDIO_FORMAT_WAV = 2;
}

message SynthesizeRequest {
  string text = 1;
  // voice_id is "provider:name". Today the only provider is "voxcpm", so ids
  // look like "voxcpm:<id>". An id with no provider prefix is rejected with
  // INVALID_ARGUMENT.
  string voice_id = 2;
  double speaking_rate = 3;
  AudioFormat format = 4;
  // label is caller-supplied and appears in logs only ("director:backsell").
  string label = 5;
}

message SynthesizeResponse {
  bytes audio = 1;
  AudioFormat format = 2;
  string voice_id = 3;
  string provider = 4;
  // cost_usd is 0 for self-hosted voices.
  double cost_usd = 5;
  bool cache_hit = 6;
}

message ListVoicesRequest {}

message ListVoicesResponse {
  repeated Voice voices = 1;
}

message Voice {
  string id = 1;
  string label = 2;
  string provider = 3;
  string tier = 4;
  string gender = 5;
  // free_tier_chars_per_month is 0 for self-hosted voices.
  int64 free_tier_chars_per_month = 6;
}

message CreateVoiceRequest {
  string label = 1;
  // gender is "MALE", "FEMALE" or "NEUTRAL".
  string gender = 2;
  // ref_audio is any container ffmpeg decodes (wav, mp3, m4a), 3-30 s.
  bytes ref_audio = 3;
  // ref_text is the exact transcript of ref_audio.
  string ref_text = 4;
}

message CreateVoiceResponse {
  Voice voice = 1;
}

message DesignVoiceRequest {
  // description is the voice in words, e.g. "giong nu tre mien Nam, am ap".
  string description = 1;
  // sample_text is the text to render, 1-250 characters.
  string sample_text = 2;
  // takes is 1-3.
  int32 takes = 3;
}

message DesignVoiceResponse {
  // takes are MP3 files, one per requested take.
  repeated bytes takes = 1;
}

message DeleteVoiceRequest {
  string id = 1;
}

message DeleteVoiceResponse {}
