syntax = "proto3";

package algovn.race.v1;

option go_package = "github.com/the-algovn/protos/gen/go/algovn/race/v1;racev1";

// RaceService is Đua Vịt's contract (gateway prefix /the-race). Creating rooms
// and races is authenticated; reading a race, a room or a room's history is
// anonymous, so a shared link works for someone who never signs in.
//
// Starting a race is deliberately two calls. CreateRace publishes
// sha256(server_seed) and stops; StartRace supplies the client nonce that gets
// mixed in. Collapsing them would let the server see both halves of the seed at
// once, which throws the fairness guarantee away.
//
// Spec: the-algovn/specs products/the-race.md
service RaceService {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc CreateRace(CreateRaceRequest) returns (CreateRaceResponse);
  rpc StartRace(StartRaceRequest) returns (StartRaceResponse);
  rpc GetRace(GetRaceRequest) returns (GetRaceResponse);
  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
  rpc ListRoomRaces(ListRoomRacesRequest) returns (ListRoomRacesResponse);
}

enum RaceStatus {
  RACE_STATUS_UNSPECIFIED = 0;
  // Committed, waiting for the client's nonce.
  RACE_STATUS_AWAITING_NONCE = 1;
  // Nonce accepted; the package is being authored.
  RACE_STATUS_PREPARING = 2;
  RACE_STATUS_READY = 3;
  RACE_STATUS_FAILED = 4;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_START = 1;
  EVENT_KIND_OVERTAKE = 2;
  EVENT_KIND_LEAD_CHANGE = 3;
  EVENT_KIND_PHOTO_FINISH = 4;
  EVENT_KIND_FINISH = 5;
}

message Room {
  string id = 1;
  // Short shoutable code; the share link carries this, not the id.
  string code = 2;
  string title = 3;
  int64 created_at_ms = 4;
}

message CreateRoomRequest {
  string title = 1;
}

message CreateRoomResponse {
  Room room = 1;
}

message GetRoomRequest {
  string code = 1;
}

message GetRoomResponse {
  Room room = 1;
}

message CreateRaceRequest {
  string room_id = 1;
  // 2..12 names, each 1..24 characters after trimming.
  repeated string duck_names = 2;
}

message CreateRaceResponse {
  string race_id = 1;
  // sha256(server_seed), hex. Published before the seed exists in usable form.
  string seed_commit = 2;
}

message StartRaceRequest {
  string race_id = 1;
  // 8..64 characters of client entropy, mixed into the committed server seed.
  string client_nonce = 2;
}

message StartRaceResponse {
  RaceStatus status = 1;
}

// Tick is one 20 Hz sample. positions[i] is duck i's progress in [0, 1];
// 1.0 is the finish line.
message Tick {
  int32 t_ms = 1;
  repeated float positions = 2;
}

message Event {
  int32 t_ms = 1;
  EventKind kind = 2;
  repeated int32 duck_indexes = 3;
}

// Line is one call from the commentator. audio_url is empty until the AI caster
// ships, and is then a presigned MinIO URL.
message Line {
  int32 at_ms = 1;
  string text = 2;
  // 1 filler .. 5 the finish call. Drives which line gets dropped when the
  // client re-times the schedule against real clip durations.
  int32 intensity = 3;
  string audio_url = 4;
}

// Fairness carries the commit-reveal evidence. server_seed and seed are empty
// until the race is READY — revealing them earlier would defeat the commit.
message Fairness {
  string seed_commit = 1;
  string server_seed = 2;
  string client_nonce = 3;
  string seed = 4;
}

message RacePackage {
  string race_id = 1;
  string room_id = 2;
  repeated string duck_names = 3;
  int32 duration_ms = 4;
  repeated Tick ticks = 5;
  repeated Event events = 6;
  // Duck indexes, winner first.
  repeated int32 finish_order = 7;
  repeated Line lines = 8;
  string drama = 9;
  Fairness fairness = 10;
  // Spoken before the gun. A separate track with its own clock starting at 0 —
  // the race clock's origin is the gun, so these cannot share it. Laid out
  // sequentially by the client, not scheduled against the race timeline.
  repeated Line intro_lines = 11;
}

message GetRaceRequest {
  string race_id = 1;
}

message GetRaceResponse {
  RaceStatus status = 1;
  // Populated only when status is READY.
  RacePackage race = 2;
  // Human-readable progress while PREPARING: simulating | commentating | voicing.
  string prepare_stage = 3;
  string error = 4;
}

message ListRoomRacesRequest {
  string room_id = 1;
}

message RaceSummary {
  string race_id = 1;
  RaceStatus status = 2;
  repeated string duck_names = 3;
  // -1 until the race is READY.
  int32 winner_index = 4;
  int64 created_at_ms = 5;
}

message WinTally {
  string duck_name = 1;
  int32 wins = 2;
}

message ListRoomRacesResponse {
  repeated RaceSummary races = 1;
  repeated WinTally tally = 2;
}
